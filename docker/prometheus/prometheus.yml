global:
  scrape_interval: 15s
scrape_configs:
  - job_name: bmtickets
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - catalog-service:8081
          - seat-inventory-service:8082
          - booking-service:8083
          - payment-service:8084
          - notification-service:8085
