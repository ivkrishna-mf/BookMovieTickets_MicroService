# Secrets live in AWS Secrets Manager (rotatable, audited by CloudTrail) and are synced into Kubernetes Secrets
# by the External Secrets Operator. Nothing secret is stored in Git or baked into images (12-factor III).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader      # IRSA role with secretsmanager:GetSecretValue on bmtickets/*
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/bmtickets-external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: catalog-service-secrets }
  dataFrom:
    - extract: { key: bmtickets/catalog-service }        # {"DB_HOST": "...proxy...", "DB_USERNAME": "...", "DB_PASSWORD": "..."}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: seat-inventory-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: seat-inventory-service-secrets }
  dataFrom:
    - extract: { key: bmtickets/seat-inventory-service }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: booking-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: booking-service-secrets }
  dataFrom:
    - extract: { key: bmtickets/booking-service }        # + SERVICE_CLIENT_ID, SERVICE_CLIENT_SECRET, TICKET_SIGNING_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: payment-service-secrets }
  dataFrom:
    - extract: { key: bmtickets/payment-service }        # + STRIPE_API_KEY, STRIPE_WEBHOOK_SECRET
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: notification-service-secrets }
  dataFrom:
    - extract: { key: bmtickets/notification-service }
