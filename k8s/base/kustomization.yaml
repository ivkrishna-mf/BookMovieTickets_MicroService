apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bmtickets
labels:
  - pairs:
      app.kubernetes.io/part-of: bmtickets
    includeSelectors: false
resources:
  - namespace.yaml
  - platform-config.yaml
  - serviceaccounts.yaml
  - rbac-discovery.yaml
  - external-secrets.yaml
  - network-policies.yaml
  - ingress.yaml
  - keda-notification.yaml
  - services/api-gateway.yaml
  - services/catalog-service.yaml
  - services/seat-inventory-service.yaml
  - services/booking-service.yaml
  - services/payment-service.yaml
  - services/notification-service.yaml
