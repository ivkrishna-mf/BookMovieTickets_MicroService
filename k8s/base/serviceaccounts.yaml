# One identity per service (least privilege). IRSA maps each to its own IAM role:
#   payment-service      -> secretsmanager:GetSecretValue on bmtickets/payment/*  (via External Secrets)
#   notification-service -> ses:SendEmail on the verified identity
# Created by eksctl (k8s/cluster/eksctl-cluster.yaml) or annotate manually as below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seat-inventory-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: booking-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: notification-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/bmtickets-notification-ses
