# AWS Distro for OpenTelemetry (ADOT) collector:
#   traces  (OTLP from every service) -> AWS X-Ray
#   metrics (scrapes /actuator/prometheus) -> Amazon Managed Service for Prometheus (SigV4 remote write)
# Logs go stdout(JSON) -> Fluent Bit (EKS add-on / aws-for-fluent-bit) -> CloudWatch Logs.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
  annotations:
    # IAM role with AWSXrayWriteOnlyAccess + AmazonPrometheusRemoteWriteAccess
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/bmtickets-otel-collector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-scrape
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-scrape
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otel-collector-scrape }
subjects:
  - { kind: ServiceAccount, name: otel-collector, namespace: observability }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    extensions:
      health_check: {}
      sigv4auth:
        region: ap-south-1
        service: aps
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
          grpc: { endpoint: 0.0.0.0:4317 }
      prometheus:
        config:
          scrape_configs:
            - job_name: bmtickets-pods
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: { names: [bmtickets] }
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  target_label: __metrics_path__
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: ([^:]+)(?::\d+)?;(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  target_label: service
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: pod
    processors:
      memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
      batch: { timeout: 5s, send_batch_size: 1024 }
    exporters:
      awsxray:
        region: ap-south-1
        indexed_attributes: [http.route, booking.id]
      prometheusremotewrite:
        endpoint: https://aps-workspaces.ap-south-1.amazonaws.com/workspaces/<AMP_WORKSPACE_ID>/api/v1/remote_write
        auth: { authenticator: sigv4auth }
    service:
      extensions: [health_check, sigv4auth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [awsxray]
        metrics:
          receivers: [prometheus, otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
spec:
  replicas: 2
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      serviceAccountName: otel-collector
      containers:
        - name: collector
          image: public.ecr.aws/aws-observability/aws-otel-collector:v0.43.3
          args: ["--config=/conf/config.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          resources:
            requests: { cpu: 200m, memory: 400Mi }
            limits: { memory: 800Mi }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
