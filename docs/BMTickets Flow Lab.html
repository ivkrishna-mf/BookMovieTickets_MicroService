<style>
/* Layout: signal-board console — tab rail of patterns, a live schematic stage, and a side column of narration + code pointers. */
:root{
  color-scheme: dark;
  --bg:#0b111b; --panel:#111a28; --panel-2:#16212f; --line:#24324a; --line-2:#33445f;
  --fg:#e3eaf4; --muted:#8c9bb2; --node:#142033;
  --req:#5cc8ff; --ok:#3ddc97; --warn:#ffb547; --err:#ff5d6c; --evt:#b48cff; --data:#7fd1c4;
  --glow:0.55;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme: light;
  --bg:#eef2f7; --panel:#ffffff; --panel-2:#f5f8fc; --line:#cfd8e5; --line-2:#b5c2d4;
  --fg:#122033; --muted:#566781; --node:#ffffff;
  --req:#0577b8; --ok:#0f8a57; --warn:#b06a00; --err:#cf2d40; --evt:#6a43d1; --data:#0f7f72; --glow:0.25;
}}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eef2f7; --panel:#ffffff; --panel-2:#f5f8fc; --line:#cfd8e5; --line-2:#b5c2d4;
  --fg:#122033; --muted:#566781; --node:#ffffff;
  --req:#0577b8; --ok:#0f8a57; --warn:#b06a00; --err:#cf2d40; --evt:#6a43d1; --data:#0f7f72; --glow:0.25;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,38px);line-height:1.1;margin:4px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--req)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;font:500 14px var(--f-body);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{color:var(--fg);border-color:var(--line-2)}
nav.tabs button[aria-selected="true"]{color:var(--bg);background:var(--req);border-color:var(--req)}
nav.tabs button:focus-visible, .ctl button:focus-visible, .ctl input:focus-visible, .seg button:focus-visible{outline:2px solid var(--req);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width: 1000px){ .grid{grid-template-columns:minmax(0,1fr)} }
.stagecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.stagehead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;padding:14px 16px 0}
.stagehead h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0}
.stagehead p{margin:0;color:var(--muted);font-size:14px;max-width:70ch}
.stage-scroll{overflow-x:auto}
svg#stage{display:block;width:100%;min-width:700px;height:auto}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel-2)}
.transport{display:flex;gap:6px;align-items:center}
.btn{font:500 13px var(--f-body);color:var(--fg);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--req)}
.btn.primary{background:var(--req);border-color:var(--req);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ctl label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.ctl input[type=range]{width:110px;accent-color:var(--req)}
.ctl output{font-family:var(--f-mono);font-size:12px;color:var(--fg);min-width:3ch}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{font:500 12px var(--f-body);background:var(--panel);color:var(--muted);border:0;padding:6px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sep{width:1px;height:22px;background:var(--line-2)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{font:600 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
#now-title{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.25;margin:0 0 4px}
#now-body{margin:0;color:var(--muted);font-size:14px}
#log{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto;font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:4px}
#log li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
#log time{color:var(--muted);font-variant-numeric:tabular-nums}
#log .t-ok{color:var(--ok)} #log .t-warn{color:var(--warn)} #log .t-err{color:var(--err)} #log .t-evt{color:var(--evt)} #log .t-req{color:var(--req)}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.refs code{font-family:var(--f-mono);font-size:12px;color:var(--req);word-break:break-all}
.refs span{display:block;color:var(--muted)}
.cfg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:0}
.cfg dt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cfg dd{margin:0;font-variant-numeric:tabular-nums}
/* ---------- SVG ---------- */
.edge{fill:none;stroke:var(--line-2);stroke-width:1.4;opacity:.65}
.edge.on{stroke:var(--req);opacity:1;stroke-width:2;stroke-dasharray:6 6;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.node rect.box{fill:var(--node);stroke:var(--line-2);stroke-width:1.4;transition:stroke .2s, filter .2s}
.node.k-gw rect.box{stroke:var(--req)}
.node.k-data rect.box{stroke:var(--data)}
.node.k-bus rect.box{stroke:var(--evt)}
.node.k-ext rect.box{stroke-dasharray:4 3}
.node.k-client rect.box{fill:var(--panel-2)}
.node[data-state="ok"] rect.box{stroke:var(--ok);stroke-width:2.4;filter:drop-shadow(0 0 8px color-mix(in srgb, var(--ok) calc(var(--glow)*100%), transparent))}
.node[data-state="warn"] rect.box{stroke:var(--warn);stroke-width:2.4;filter:drop-shadow(0 0 8px color-mix(in srgb, var(--warn) calc(var(--glow)*100%), transparent))}
.node[data-state="err"] rect.box{stroke:var(--err);stroke-width:2.4;filter:drop-shadow(0 0 8px color-mix(in srgb, var(--err) calc(var(--glow)*100%), transparent))}
.node[data-state="busy"] rect.box{stroke:var(--req);stroke-width:2.4;filter:drop-shadow(0 0 8px color-mix(in srgb, var(--req) calc(var(--glow)*100%), transparent))}
.n-t{font:600 14px var(--f-body);fill:var(--fg)}
.n-s{font:400 11px var(--f-mono);fill:var(--muted)}
.n-k{font:500 9.5px var(--f-mono);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pk circle{stroke:var(--bg);stroke-width:2}
.pk-req circle{fill:var(--req)} .pk-ok circle{fill:var(--ok)} .pk-warn circle{fill:var(--warn)} .pk-err circle{fill:var(--err)} .pk-evt circle{fill:var(--evt)}
.pk-l{font:500 10.5px var(--f-mono);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;text-anchor:middle}
.pk-req .pk-l{fill:var(--req)} .pk-ok .pk-l{fill:var(--ok)} .pk-warn .pk-l{fill:var(--warn)} .pk-err .pk-l{fill:var(--err)} .pk-evt .pk-l{fill:var(--evt)}
.o-t{font:500 11px var(--f-mono);fill:var(--muted)}
.o-tb{font:600 12px var(--f-mono);fill:var(--fg)}
.o-h{font:600 13px var(--f-body);fill:var(--fg)}
.o-box{fill:var(--panel-2);stroke:var(--line-2);stroke-width:1}
.o-line{stroke:var(--line-2);stroke-width:1.2;fill:none;stroke-dasharray:3 4}
.f-ok{fill:var(--ok)} .f-warn{fill:var(--warn)} .f-err{fill:var(--err)} .f-req{fill:var(--req)} .f-evt{fill:var(--evt)} .f-muted{fill:var(--line-2)} .f-data{fill:var(--data)}
.s-ok{stroke:var(--ok)} .s-warn{stroke:var(--warn)} .s-err{stroke:var(--err)} .s-req{stroke:var(--req)}
.chip rect{fill:var(--panel-2);stroke:var(--line-2)}
.chip text{font:600 11px var(--f-mono);fill:var(--muted);text-anchor:middle}
.chip.on rect{fill:var(--req);stroke:var(--req)} .chip.on text{fill:var(--bg)}
.chip.ok rect{fill:var(--ok);stroke:var(--ok)} .chip.ok text{fill:var(--bg)}
.chip.err rect{fill:var(--err);stroke:var(--err)} .chip.err text{fill:var(--bg)}
.chip.warn rect{fill:var(--warn);stroke:var(--warn)} .chip.warn text{fill:var(--bg)}
.cell{stroke:var(--line-2);stroke-width:1}
.bigstate{font:700 20px var(--f-display)}
@media (prefers-reduced-motion: reduce){ .edge.on{animation:none} .node rect.box{transition:none} }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">BMTickets · microservices on EKS</div>
      <h1>Flow Lab: watch every request, event and <em>pattern</em> move</h1>
    </div>
    <div class="legend" aria-label="Legend">
      <span><i style="background:var(--req)"></i>sync call (REST / gRPC)</span>
      <span><i style="background:var(--evt)"></i>async event (Kafka)</span>
      <span><i style="background:var(--ok)"></i>success</span>
      <span><i style="background:var(--warn)"></i>throttled / fallback</span>
      <span><i style="background:var(--err)"></i>rejected / failure</span>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Patterns"></nav>

  <div class="grid">
    <section class="stagecard" aria-live="off">
      <div class="stagehead">
        <h2 id="scene-title">Architecture</h2>
        <p id="scene-sub"></p>
      </div>
      <div class="stage-scroll">
        <svg id="stage" viewBox="0 0 1000 600" role="img" aria-label="Animated architecture diagram"></svg>
      </div>
      <div class="bar">
        <div class="transport">
          <button class="btn primary" id="btn-play" type="button" aria-label="Pause">❚❚ Pause</button>
          <button class="btn" id="btn-restart" type="button">↺ Restart</button>
          <div class="seg" id="speed" role="group" aria-label="Speed">
            <button type="button" data-v="0.5" aria-pressed="false">0.5×</button>
            <button type="button" data-v="1" aria-pressed="true">1×</button>
            <button type="button" data-v="2" aria-pressed="false">2×</button>
          </div>
        </div>
        <div class="sep" aria-hidden="true"></div>
        <div class="ctl" id="controls"></div>
      </div>
    </section>

    <aside class="side">
      <div class="card">
        <h3>Now happening</h3>
        <p id="now-title">—</p>
        <p id="now-body"></p>
      </div>
      <div class="card">
        <h3>Event log</h3>
        <ul id="log"></ul>
      </div>
      <div class="card">
        <h3>Production settings</h3>
        <dl class="cfg" id="cfg"></dl>
      </div>
      <div class="card">
        <h3>Where it lives in the code</h3>
        <ul class="refs" id="refs"></ul>
      </div>
    </aside>
  </div>
</div>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('stage');
const $ = (id) => document.getElementById(id);
class Abort extends Error {}

/* ===================== engine ===================== */
const E = { speed: 1, paused: false, token: 0, sim: 0, tickers: new Set(), waiters: [], anims: new Set(),
            nodes: {}, edges: {}, layers: {}, busy: false };

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

let lastTs = null;
function frame(ts) {
  const dt = lastTs == null ? 0 : Math.min(60, ts - lastTs);
  lastTs = ts;
  if (!E.paused) {
    const sdt = dt * E.speed;
    E.sim += sdt;
    for (const f of [...E.tickers]) { try { f(sdt); } catch (e) { console.error(e); } }
    if (E.waiters.length) {
      const due = E.waiters.filter(w => w.at <= E.sim);
      if (due.length) { E.waiters = E.waiters.filter(w => w.at > E.sim); due.forEach(w => w.resolve()); }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function wait(ms) {
  const tok = E.token;
  return new Promise((resolve, reject) => {
    E.waiters.push({ at: E.sim + ms, resolve: () => tok === E.token ? resolve() : reject(new Abort()), reject });
  });
}

function animate(dur, onFrame) {
  const tok = E.token;
  return new Promise((resolve, reject) => {
    let t = 0;
    const a = { reject };
    const tick = (sdt) => {
      if (tok !== E.token) { E.tickers.delete(tick); return; }
      t += sdt;
      const p = Math.min(1, t / Math.max(1, dur));
      onFrame(p);
      if (p >= 1) { E.tickers.delete(tick); E.anims.delete(a); resolve(); }
    };
    E.anims.add(a);
    E.tickers.add(tick);
    onFrame(0);
  });
}

function resetEngine() {
  E.token++;
  E.waiters.forEach(w => w.reject(new Abort())); E.waiters = [];
  E.anims.forEach(a => a.reject(new Abort())); E.anims.clear();
  E.tickers.clear();
  E.nodes = {}; E.edges = {}; E.busy = false;
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  E.layers.edges = el('g', { class: 'l-edges' }, svg);
  E.layers.under = el('g', { class: 'l-under' }, svg);
  E.layers.nodes = el('g', { class: 'l-nodes' }, svg);
  E.layers.over = el('g', { class: 'l-over' }, svg);
  E.layers.pk = el('g', { class: 'l-pk' }, svg);
  $('log').innerHTML = '';
}

function node(d) {
  const g = el('g', { class: 'node k-' + (d.kind || 'svc'), transform: `translate(${d.x},${d.y})` }, E.layers.nodes);
  el('rect', { class: 'box', width: d.w, height: d.h, rx: 10 }, g);
  const t = el('text', { class: 'n-t', x: 12, y: 22 }, g); t.textContent = d.t;
  const s = el('text', { class: 'n-s', x: 12, y: 39 }, g);
  if (d.tag) { const k = el('text', { class: 'n-k', x: d.w - 10, y: 16, 'text-anchor': 'end' }, g); k.textContent = d.tag; }
  const n = { ...d, g, s };
  E.nodes[d.id] = n;
  setSub(d.id, d.s || '');
  return n;
}
function setSub(id, text) {
  const n = E.nodes[id]; if (!n) return;
  while (n.s.firstChild) n.s.removeChild(n.s.firstChild);
  String(text).split('\n').forEach((line, i) => {
    const ts = el('tspan', { x: 12, dy: i === 0 ? 0 : 14 }, n.s); ts.textContent = line;
  });
}
function setState(id, s) { const n = E.nodes[id]; if (n) { if (s) n.g.setAttribute('data-state', s); else n.g.removeAttribute('data-state'); } }
function flash(id, s, ms = 700) {
  setState(id, s);
  const tok = E.token;
  wait(ms).then(() => { if (tok === E.token && E.nodes[id] && E.nodes[id].g.getAttribute('data-state') === s) setState(id, ''); }).catch(() => {});
}

const DIRS = { l: [-1, 0], r: [1, 0], t: [0, -1], b: [0, 1] };
function anchor(n, side, d = 0) {
  switch (side) {
    case 'l': return [n.x, n.y + n.h / 2 + d];
    case 'r': return [n.x + n.w, n.y + n.h / 2 + d];
    case 't': return [n.x + n.w / 2 + d, n.y];
    default: return [n.x + n.w / 2 + d, n.y + n.h];
  }
}
function autoSides(a, b) {
  const dx = (b.x + b.w / 2) - (a.x + a.w / 2), dy = (b.y + b.h / 2) - (a.y + a.h / 2);
  if (Math.abs(dx) >= Math.abs(dy) * 0.9) return dx > 0 ? ['r', 'l'] : ['l', 'r'];
  return dy > 0 ? ['b', 't'] : ['t', 'b'];
}
function edge(id, from, to, o = {}) {
  let d = o.d;
  if (!d) {
    const a = E.nodes[from], b = E.nodes[to];
    const [s1, s2] = o.sides || autoSides(a, b);
    const p1 = anchor(a, s1, o.d1 || 0), p2 = anchor(b, s2, o.d2 || 0);
    const dist = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const k = o.k || Math.max(30, dist * 0.4);
    const c1 = [p1[0] + DIRS[s1][0] * k, p1[1] + DIRS[s1][1] * k];
    const c2 = [p2[0] + DIRS[s2][0] * k, p2[1] + DIRS[s2][1] * k];
    d = `M${p1[0]},${p1[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
  }
  const path = el('path', { class: 'edge', d }, E.layers.edges);
  if (o.hidden) path.style.opacity = '0';
  E.edges[id] = { path, len: path.getTotalLength(), active: 0 };
}

async function send(edgeId, o = {}) {
  const e = E.edges[edgeId];
  if (!e) throw new Error('no edge ' + edgeId);
  const g = el('g', { class: 'pk pk-' + (o.color || 'req') }, E.layers.pk);
  el('circle', { r: o.r || 6.5 }, g);
  if (o.label) { const t = el('text', { class: 'pk-l', y: -11 }, g); t.textContent = o.label; }
  e.active++; e.path.classList.add('on');
  if (o.color && o.color !== 'req') e.path.style.stroke = `var(--${o.color})`;
  const rev = !!o.reverse, upto = o.upto ?? 1, dur = (o.dur || 750);
  const pos = (f) => { const ff = rev ? 1 - f : f; const pt = e.path.getPointAtLength(Math.max(0, Math.min(1, ff)) * e.len); g.setAttribute('transform', `translate(${pt.x},${pt.y})`); };
  try {
    await animate(dur * upto, p => pos(p * upto));
    if (o.bounce) await animate(dur * upto * 0.8, p => pos(upto * (1 - p)));
    if (o.drop) { await animate(350, p => { g.style.opacity = String(1 - p); }); }
  } finally {
    g.remove();
    e.active--;
    if (e.active <= 0) { e.path.classList.remove('on'); e.path.style.stroke = ''; }
  }
}

function log(msg, tone = '') {
  const li = document.createElement('li');
  const t = document.createElement('time'); t.textContent = '+' + (E.sim / 1000).toFixed(1) + 's';
  const m = document.createElement('span'); m.textContent = msg; if (tone) m.className = 't-' + tone;
  li.append(t, m);
  const ul = $('log'); ul.prepend(li);
  while (ul.children.length > 80) ul.lastChild.remove();
}
function say(title, body) { $('now-title').textContent = title; $('now-body').textContent = body || ''; }

/* overlay helpers */
const O = {
  g(parent) { return el('g', {}, parent || E.layers.over); },
  text(x, y, s, cls = 'o-t', anchorPos = 'start', parent) { const t = el('text', { x, y, class: cls, 'text-anchor': anchorPos }, parent || E.layers.over); t.textContent = s; return t; },
  rect(x, y, w, h, cls = 'o-box', rx = 6, parent) { return el('rect', { x, y, width: w, height: h, rx, class: cls }, parent || E.layers.over); },

      a.log('process crashed before kafkaTemplate.send(): event LOST', 'err');
      this.bkState.textContent = 'booking bk-9: PENDING_PAYMENT (stuck)';
      a.flash('bk', 'err', 1400);
      a.say('Inconsistent', 'Money is captured, but the booking is stuck in PENDING_PAYMENT. The outbox removes this failure window, and reconciliation catches anything left over.');
      await a.wait(900); a.setState('pay', '');
      return;
    }
    a.say('One local transaction', 'UPDATE payment and INSERT outbox_event commit together, or not at all.');
    a.setState('pg', 'busy');
    await a.send('pay-pg', { dur: 800, label: 'BEGIN · UPDATE · INSERT · COMMIT' });
    this.rowPay.v.textContent = 'SUCCEEDED'; this.rowOut.v.textContent = `${this.eventId} · unpublished`;
    this.rowPay.box.setAttribute('class', 'o-box s-ok'); this.rowOut.box.setAttribute('class', 'o-box s-ok');
    this.pending = true; a.setState('pg', 'ok');
    await a.send('pay-pg', { reverse: true, color: 'ok', dur: 500, label: 'committed' });
    a.setState('pg', '');
    this.rowPay.box.setAttribute('class', 'o-box');
    a.say('Relay publishes', 'Every pod polls with SKIP LOCKED, so each row is claimed by exactly one pod. The row is published to Kafka and marked published after the broker acks.');
    await this.poll(a, mode === 'dup');
    if (mode === 'dup') {
      await a.wait(600);
      a.say('Duplicate delivery', 'The row was never marked published, so the next poll publishes it again. The booking\'s InboxGuard recognises the event id and skips it.');
      await this.poll(a, false);
    }
    await a.wait(1200);
  },
  async run(a) { await a.wait(400); await this.flow(a, 'ok'); a.say('Try the failure cases', 'Relay crash shows at-least-once delivery handled by the inbox. Dual write shows the bug the outbox prevents.'); },
});

/* ---------- 9. Idempotency key ---------- */
scenes.push({
  id: 'idempotency', tab: 'Idempotency key',
  title: 'Idempotency-Key on POST /bookings',
  sub: 'The client sends a unique key per booking intent and reuses it on retries. Redis SET NX makes duplicate requests replay the first result instead of running the saga twice.',
  cfg: [['Lock record', 'IN_PROGRESS, TTL 60 s'], ['Result record', 'COMPLETED + response, TTL 24 h'], ['Fingerprint', 'SHA-256(showId + sorted seats)'], ['Concurrent duplicate', '409 REQUEST_IN_PROGRESS'], ['Different body, same key', '422 IDEMPOTENCY_KEY_REUSED'], ['Redis lost', 'DB UNIQUE (user_id, idempotency_key)']],
  refs: [['booking-service/…/idempotency/IdempotencyService.java', 'SET NX → execute → store / replay'], ['booking-service/…/api/BookingController.java', 'Idempotency-Key header + fingerprint'], ['booking-service/…/db/migration/V1__booking_schema.sql', 'unique constraints (durable backstop)']],
  controls: [
    { type: 'button', label: '▶ Double-click (same key)', excl: true, act: (a, s) => a.exclusive(() => s.double(a)) },
    { type: 'button', label: 'Timeout, then retry', excl: true, act: (a, s) => a.exclusive(() => s.timeout(a)) },
    { type: 'button', label: 'Same key, other seats', excl: true, act: (a, s) => a.exclusive(() => s.reuse(a)) },
  ],
  build(a) {
    a.node({ id: 'c', x: 30, y: 246, w: 170, h: 76, t: 'alice', s: 'Idempotency-Key:\nK-7f3a', kind: 'client' });
    a.node({ id: 'bk', x: 360, y: 236, w: 210, h: 96, t: 'booking-service', s: 'IdempotencyService', kind: 'gw' });
    a.node({ id: 'redis', x: 700, y: 50, w: 270, h: 96, t: 'Redis', s: 'idem:booking:alice:K-7f3a', kind: 'data' });
    a.node({ id: 'saga', x: 700, y: 420, w: 270, h: 80, t: 'booking saga', s: 'hold seats + PaymentIntent', kind: 'svc' });
    a.edge('c-bk1', 'c', 'bk', { sides: ['r', 'l'], d1: -16, d2: -16 });
    a.edge('c-bk2', 'c', 'bk', { sides: ['r', 'l'], d1: 16, d2: 16 });
    a.edge('bk-redis', 'bk', 'redis', { sides: ['r', 'l'], d1: -20 });
    a.edge('bk-saga', 'bk', 'saga', { sides: ['r', 'l'], d1: 20 });
    this.recTxt = O.text(712, 172, '', 'o-tb');
    this.recTxt2 = O.text(712, 190, '', 'o-t');
    this.sagaRuns = 0;
    this.sagaTxt = O.text(700, 524, '', 'o-t');
    this.rec = null;
    this.paint();
  },
  paint() {
    this.recTxt.textContent = this.rec ? `state: ${this.rec.state}` : 'record: (none)';
    this.recTxt2.textContent = this.rec ? `hash: ${this.rec.hash}` + (this.rec.state === 'COMPLETED' ? ' · response: 201 bk-9' : '') : '';
    this.sagaTxt.textContent = `saga executions: ${this.sagaRuns}`;
  },
  async req(a, lane, hash, opts = {}) {
    const e = 'c-bk' + lane;
    await a.send(e, { dur: 650, label: `POST · K-7f3a · ${hash}` });
    await a.send('bk-redis', { dur: 500, label: 'SET NX' });
    if (!this.rec) {
      this.rec = { state: 'IN_PROGRESS', hash }; this.paint(); a.flash('redis', 'ok', 400);
      await a.send('bk-redis', { reverse: true, color: 'ok', dur: 450, label: 'acquired' });
      a.setState('saga', 'busy');
      await a.send('bk-saga', { dur: 600, label: 'run saga' });
      this.sagaRuns++; this.paint();
      await a.wait(1600);
      await a.send('bk-saga', { reverse: true, color: 'ok', dur: 600, label: 'bk-9' });
      a.setState('saga', '');
      await a.send('bk-redis', { dur: 500, label: 'store COMPLETED' });
      this.rec.state = 'COMPLETED'; this.paint();
      await a.send('bk-redis', { reverse: true, color: 'ok', dur: 450 });
      if (opts.lose) {
        await a.send(e, { reverse: true, color: 'err', dur: 650, upto: 0.55, label: '201 lost', drop: true });
        a.log('network timeout: the client never saw the 201', 'err');
        a.flash('c', 'err', 900);
        return;
      }
      await a.send(e, { reverse: true, color: 'ok', dur: 650, label: '201 PENDING_PAYMENT' });
      a.log('first request: saga executed, 201 returned', 'ok');
      return;
    }
    await a.send('bk-redis', { reverse: true, color: 'warn', dur: 450, label: 'exists' });
    await a.send('bk-redis', { dur: 450, label: 'GET' });
    const r = this.rec;
    await a.send('bk-redis', { reverse: true, color: 'warn', dur: 450, label: r.state });
    if (r.hash !== hash) {
      a.log('same key with a different request body → 422', 'err');
      await a.send(e, { reverse: true, color: 'err', dur: 650, label: '422 KEY_REUSED' });
      return;
    }
    if (r.state === 'IN_PROGRESS') {
      a.log('duplicate while the first is still running → 409 in progress', 'warn');
      await a.send(e, { reverse: true, color: 'warn', dur: 650, label: '409 IN_PROGRESS' });
      return;
    }
    a.log('duplicate after completion → stored 201 replayed, saga not re-run', 'ok');
    await a.send(e, { reverse: true, color: 'ok', dur: 650, label: '201 · Idempotent-Replayed' });
  },
  fresh(a) { this.rec = null; this.sagaRuns = 0; this.paint(); a.setState('c', ''); },
  async double(a) {
    this.fresh(a);
    a.say('Double-click', 'Two identical requests arrive about 100 ms apart. Only the first acquires the key. The second sees IN_PROGRESS and gets 409, so the saga runs once.');
    await Promise.all([this.req(a, 1, 'h:a1b2'), (async () => { await a.wait(260); await this.req(a, 2, 'h:a1b2'); })()]);
    await a.wait(400);
    a.say('Later retry', 'Once the first request completes, any retry with the same key gets the stored 201 back.');
    await this.req(a, 2, 'h:a1b2');
  },
  async timeout(a) {
    this.fresh(a);
    a.say('Response lost', 'The booking succeeded, but the 201 was lost on the network. The client retries with the same key and receives the original response. No second hold, no second PaymentIntent.');
    await this.req(a, 1, 'h:a1b2', { lose: true });
    await a.wait(500);
    await this.req(a, 1, 'h:a1b2');
  },
  async reuse(a) {
    if (!this.rec || this.rec.state !== 'COMPLETED') { this.fresh(a); await this.req(a, 1, 'h:a1b2'); await a.wait(400); }
    a.say('Key reuse', 'A key identifies exactly one intent. The same key with different seats is rejected with 422 rather than silently returning the old booking.');
    await this.req(a, 2, 'h:c3d4');
  },
  async run(a) { await a.wait(400); await this.double(a); },
});

/* ===================== UI wiring ===================== */
let current = null;
const tabs = $('tabs');
scenes.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button'; b.setAttribute('role', 'tab'); b.textContent = s.tab; b.dataset.id = s.id;
  b.addEventListener('click', () => { if (location.hash !== '#' + s.id) location.hash = s.id; else select(s.id); });
  tabs.appendChild(b);
});

function syncControls(s) {
  if (s !== current) return;
  document.querySelectorAll('#controls [data-key]').forEach(c => {
    const k = c.dataset.key, v = s.opts[k];
    if (c.classList.contains('seg')) c.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(v))));
    else if (c.type === 'checkbox') c.checked = !!v;
    else if (c.type === 'range') { c.value = v; const o = c.parentElement.querySelector('output'); if (o) o.textContent = v; }
  });
}

function buildControls(s) {
  const box = $('controls'); box.innerHTML = '';
  (s.controls || []).forEach((c, idx) => {
    if (c.when && s.opts.mode !== c.when) return;
    const id = `ctl-${s.id}-${idx}`;
    if (c.type === 'button') {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'btn' + (c.excl ? ' excl' : ''); b.id = id; b.textContent = c.label;
      b.addEventListener('click', () => c.act(api, s));
      box.appendChild(b);
    } else if (c.type === 'toggle') {
      const l = document.createElement('label'); const i = document.createElement('input'); i.type = 'checkbox'; i.id = id; i.dataset.key = c.key; i.checked = !!s.opts[c.key];
      i.addEventListener('change', () => { s.opts[c.key] = i.checked; });
      l.append(i, document.createTextNode(c.label)); box.appendChild(l);
    } else if (c.type === 'range') {
      const l = document.createElement('label'); l.htmlFor = id; l.append(document.createTextNode(c.label));
      const i = document.createElement('input'); i.type = 'range'; i.id = id; i.min = c.min; i.max = c.max; i.step = c.step; i.value = s.opts[c.key]; i.dataset.key = c.key;
      const o = document.createElement('output'); o.textContent = s.opts[c.key];
      i.addEventListener('input', () => { s.opts[c.key] = Number(i.value); o.textContent = i.value; if (c.key === 'burst' && s.tokens) Object.keys(s.tokens).forEach(k => s.tokens[k] = Math.min(s.tokens[k], s.opts.burst)); });
      l.append(i, o); box.appendChild(l);
    } else if (c.type === 'seg') {
      const wrap = document.createElement('label'); wrap.append(document.createTextNode(c.label));
      const seg = document.createElement('div'); seg.className = 'seg'; seg.dataset.key = c.key; seg.setAttribute('role', 'group'); seg.id = id;
      c.options.forEach(([v, t]) => {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.v = v; b.textContent = t; b.setAttribute('aria-pressed', String(s.opts[c.key] === v));
        b.addEventListener('click', () => {
          s.opts[c.key] = v;
          if (c.restart) { select(s.id); return; }
          if (s.id === 'circuit-breaker' && c.key === 'health') { s.setHealth(api, v); s.opts.auto = false; syncControls(s); return; }
          syncControls(s);
        });
        seg.appendChild(b);
      });
      wrap.appendChild(seg); box.appendChild(wrap);
    }
  });
}

function select(id) {
  const s = scenes.find(x => x.id === id) || scenes[0];
  current = s;
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === s.id)));
  const tb = tabs.querySelector(`[data-id="${s.id}"]`); if (tb && tb.scrollIntoView) tb.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  resetEngine();
  $('scene-title').textContent = s.title; $('scene-sub').textContent = s.sub;
  $('cfg').innerHTML = ''; (s.cfg || []).forEach(([k, v]) => { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; $('cfg').append(dt, dd); });
  $('refs').innerHTML = ''; (s.refs || []).forEach(([f, n]) => { const li = document.createElement('li'); const c = document.createElement('code'); c.textContent = f; const sp = document.createElement('span'); sp.textContent = n; li.append(c, sp); $('refs').appendChild(li); });
  say('—', '');
  s.build(api);
  buildControls(s);
  spawn(() => s.run(api));
}

$('btn-play').addEventListener('click', () => {
  E.paused = !E.paused;
  $('btn-play').textContent = E.paused ? '▶ Play' : '❚❚ Pause';
  $('btn-play').setAttribute('aria-label', E.paused ? 'Play' : 'Pause');
});
$('btn-restart').addEventListener('click', () => select(current.id));
$('speed').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
  E.speed = Number(b.dataset.v);
  $('speed').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
window.addEventListener('hashchange', () => select(location.hash.slice(1)));
select(location.hash.slice(1) || 'architecture');
})();
