syntax = "proto3";

package bmtickets.catalog.v1;

option java_multiple_files = true;
option java_package = "com.bmtickets.grpc.catalog.v1";
option java_outer_classname = "CatalogProto";

// Low-latency, strongly typed read used by booking-service on every booking attempt.
service CatalogQueryService {
  rpc GetShow(GetShowRequest) returns (ShowDetails);
}

message GetShowRequest {
  string show_id = 1;
}

message ShowDetails {
  string show_id = 1;
  string event_id = 2;
  string event_title = 3;
  string venue_name = 4;
  string city = 5;
  int64 start_time_epoch_ms = 6;
  string status = 7;                       // SCHEDULED | OPEN | CLOSED | CANCELLED
  string currency = 8;
  map<string, string> price_by_category = 9; // decimal as string to avoid float rounding
  int32 max_seats_per_booking = 10;
}
